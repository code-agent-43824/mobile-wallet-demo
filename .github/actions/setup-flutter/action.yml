name: Set up Flutter
description: >
  Latest Flutter stable plus the pub cache, on any runner. x64 runners use
  subosito/flutter-action (release archives); ARM64 runners have no release
  archive, so the stable branch is cloned and the tool fetches its own
  host-architecture Dart SDK.

runs:
  using: composite
  steps:
    - if: runner.arch != 'ARM64'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        cache: true

    - if: runner.arch == 'ARM64' && runner.os != 'Windows'
      name: Clone Flutter stable (ARM64)
      shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/flutter"
        git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$dir"
        echo "$dir/bin" >> "$GITHUB_PATH"

    # Windows ARM64 has no Flutter archive anywhere, so every job used to
    # clone the SDK, bootstrap its Dart SDK and tool, and fetch the engine
    # files again. The whole SDK directory is cached after use, keyed by the
    # stable commit, so a new Flutter release refreshes it.
    - if: runner.arch == 'ARM64' && runner.os == 'Windows'
      id: flutter-stable
      name: Find Flutter stable (Windows ARM64)
      shell: pwsh
      run: |
        $sha = ((git ls-remote https://github.com/flutter/flutter.git refs/heads/stable) -split '\s+')[0]
        if ($LASTEXITCODE -ne 0 -or -not $sha) { exit 1 }
        Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=$sha"

    - if: runner.arch == 'ARM64' && runner.os == 'Windows'
      id: flutter-sdk-cache
      name: Cache Flutter SDK (Windows ARM64)
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/flutter
        key: flutter-sdk-Windows-ARM64-${{ steps.flutter-stable.outputs.sha }}

    - if: runner.arch == 'ARM64' && runner.os == 'Windows'
      name: Clone Flutter stable (Windows ARM64)
      shell: pwsh
      env:
        CACHE_HIT: ${{ steps.flutter-sdk-cache.outputs.cache-hit }}
        STABLE_SHA: ${{ steps.flutter-stable.outputs.sha }}
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'flutter'
        if ($env:CACHE_HIT -ne 'true') {
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Stable moving between the lookup and the clone would store a
          # newer SDK under the older key; the next release replaces it.
          $head = git -C $dir rev-parse HEAD
          if ($head -ne $env:STABLE_SHA) { Write-Host "stable moved to $head during setup" }
        }
        Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dir 'bin')

    # On x64, subosito/flutter-action (cache: true) already restores the pub
    # cache; restoring it again here cost ~25 s on Windows.
    - if: runner.arch == 'ARM64'
      name: Cache pub packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.os == 'Windows' && '~\AppData\Local\Pub\Cache' || '~/.pub-cache' }}
        key: ${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pub-

    - if: runner.os == 'Windows'
      name: Install dependencies
      shell: pwsh
      run: |
        flutter --version
        flutter pub get

    - if: runner.os != 'Windows'
      name: Install dependencies
      shell: bash
      run: |
        flutter --version
        flutter pub get
