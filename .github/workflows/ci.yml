name: ci

# Every push and PR validates the code and builds every target. A release run
# also smoke-tests each build on a runner of the same OS and architecture
# (target-*.yml: each smoke job needs only its own build) and publishes every
# artifact as a GitHub release only after all of them passed. A release run is
#   - a push to main whose pubspec version has no release yet (the workflow
#     creates the v<version> tag; agents cannot push tags through the proxy);
#   - a pushed v* tag matching the pubspec version.
# A manual run with `smoke` ticked smoke-tests any branch without publishing.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: Smoke-test every target (no release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      smoke: ${{ steps.plan.outputs.smoke }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SMOKE_INPUT: ${{ inputs.smoke }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          release=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = "v$version" ] || { echo "Tag $REF_NAME does not match pubspec version $version"; exit 1; }
            release=true
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "v$version is already released."
            else
              echo "v$version has no release yet: this run releases it."
              release=true
            fi
          fi
          smoke="$release"
          [ "$SMOKE_INPUT" = true ] && smoke=true
          {
            echo "version=$version"
            echo "release=$release"
            echo "smoke=$smoke"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version release=$release smoke=$smoke"

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-flutter

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android
    needs: [plan, validate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/target-android.yml
    with:
      smoke: ${{ needs.plan.outputs.smoke == 'true' }}

  ios:
    name: iOS
    needs: [plan, validate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/target-ios.yml
    secrets: inherit
    with:
      smoke: ${{ needs.plan.outputs.smoke == 'true' }}

  windows_x64:
    name: Windows x64
    needs: [plan, validate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/target-windows.yml
    with:
      arch: x64
      # windows-2022 (VS 2022 / MSVC 17.x): windows-latest moved to VS 18 /
      # MSVC 14.51, which turns local_auth_windows's <experimental/coroutine>
      # usage into a hard STL1011 error.
      runner: windows-2022
      smoke: ${{ needs.plan.outputs.smoke == 'true' }}

  windows_arm64:
    name: Windows arm64
    needs: [plan, validate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/target-windows.yml
    with:
      arch: arm64
      runner: windows-11-arm
      smoke: ${{ needs.plan.outputs.smoke == 'true' }}

  linux_x64:
    name: Linux x64
    needs: [plan, validate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/target-linux.yml
    with:
      arch: x64
      runner: ubuntu-latest
      smoke: ${{ needs.plan.outputs.smoke == 'true' }}

  linux_arm64:
    name: Linux arm64
    needs: [plan, validate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/target-linux.yml
    with:
      arch: arm64
      runner: ubuntu-24.04-arm
      smoke: ${{ needs.plan.outputs.smoke == 'true' }}

  macos:
    name: macOS
    needs: [plan, validate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/target-macos.yml
    with:
      smoke: ${{ needs.plan.outputs.smoke == 'true' }}

  # Runs only after every target workflow finished, and checks each smoke
  # result itself: a target that could not prove itself blocks the release
  # instead of being skipped. Uses the preinstalled gh CLI with this job's
  # token; every input goes through env vars.
  release:
    name: GitHub release
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    needs: [plan, android, ios, windows_x64, windows_arm64, linux_x64, linux_arm64, macos]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check smoke results and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          ANDROID_X86_64: ${{ needs.android.outputs.x86_64 }}
          ANDROID_ARM64: ${{ needs.android.outputs.arm64 }}
          IOS_SIMULATOR: ${{ needs.ios.outputs.simulator }}
          WINDOWS_X64: ${{ needs.windows_x64.outputs.result }}
          WINDOWS_ARM64: ${{ needs.windows_arm64.outputs.result }}
          LINUX_X64: ${{ needs.linux_x64.outputs.result }}
          LINUX_ARM64: ${{ needs.linux_arm64.outputs.result }}
          MACOS_ARM64: ${{ needs.macos.outputs.arm64 }}
          MACOS_X64: ${{ needs.macos.outputs.x64 }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          missing=""
          row() { # target, result
            case "$2" in
              passed) echo "| $1 | ✅ запуск релизной сборки и сценарий в приложении |" ;;
              no-kvm) echo "| $1 | ⚠️ не проверено: на раннере этой архитектуры нет KVM для эмулятора |" ;;
              *) missing="$missing $1"; echo "| $1 | ❌ нет результата |" ;;
            esac
          }
          {
            echo "## Смок-тесты"
            echo
            echo "| Сборка | Проверка |"
            echo "| --- | --- |"
            row "Android x86_64" "$ANDROID_X86_64"
            row "Android arm64-v8a" "$ANDROID_ARM64"
            echo "| Android armeabi-v7a | ⚠️ не проверено: на GitHub нет 32-битных ARM-раннеров |"
            row "iOS-симулятор" "$IOS_SIMULATOR"
            echo "| iOS-устройство | ⚠️ не проверено: сборка без подписи, устройства на GitHub нет |"
            row "Windows x64" "$WINDOWS_X64"
            row "Windows arm64" "$WINDOWS_ARM64"
            row "Linux x64" "$LINUX_X64"
            row "Linux arm64" "$LINUX_ARM64"
            row "macOS arm64" "$MACOS_ARM64"
            row "macOS x64" "$MACOS_X64"
          } > smoke.md
          cat smoke.md
          [ -z "$missing" ] || { echo "Smoke result missing for:$missing"; exit 1; }

          for name in android-apk ios-simulator ios-device windows-x64 windows-arm64 linux-x64 linux-arm64 macos; do
            gh run download "$RUN_ID" -n "$name" -D dist
          done
          p="mobile-wallet-demo-$VERSION"
          mv dist/app-release.apk "dist/$p-android.apk"
          mv dist/ios-simulator.zip "dist/$p-ios-simulator.zip"
          mv dist/ios-device-unsigned.zip "dist/$p-ios-device-unsigned.zip"
          mv dist/windows-x64.zip "dist/$p-windows-x64.zip"
          mv dist/windows-arm64.zip "dist/$p-windows-arm64.zip"
          mv dist/linux-x64.tar.gz "dist/$p-linux-x64.tar.gz"
          mv dist/linux-arm64.tar.gz "dist/$p-linux-arm64.tar.gz"
          mv dist/macos.zip "dist/$p-macos.zip"

          # Notes: this version's CHANGELOG section, then the smoke table.
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $TAG" > notes.md
          { echo; cat smoke.md; } >> notes.md

          if [ "$REF_TYPE" = tag ]; then
            target=(--verify-tag)
          else
            target=(--target "$SHA")
          fi
          gh release create "$TAG" dist/"$p"-* "${target[@]}" --title "$TAG" --notes-file notes.md
