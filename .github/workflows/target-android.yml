name: target · Android

# Called by ci.yml. Builds the release APK (all ABIs), then, on a smoke run,
# launches it and runs the in-app scenario on an emulator of each ABI that a
# GitHub runner can host: x86_64 on Linux x64 (KVM), arm64-v8a on Linux arm64
# when that runner exposes KVM. armeabi-v7a has no 32-bit ARM runner.
on:
  workflow_call:
    inputs:
      smoke:
        type: boolean
        required: true
    outputs:
      x86_64:
        value: ${{ jobs.smoke_x86_64.outputs.result }}
      arm64:
        value: ${{ jobs.smoke_arm64.outputs.result }}

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: ./.github/actions/setup-flutter

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=dart_defines.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  smoke_x86_64:
    name: Smoke x86_64
    needs: build
    if: inputs.smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: ./.github/actions/setup-flutter

      - name: Download the release APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" -n android-apk -D dist

      - name: Launch and scenario on the emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/smoke/android_smoke.sh dist/app-release.apk

      - id: result
        run: echo "result=passed" >> "$GITHUB_OUTPUT"

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-android-x86_64
          path: build/smoke
          if-no-files-found: ignore

  smoke_arm64:
    name: Smoke arm64-v8a
    needs: build
    if: inputs.smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Hardware acceleration
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No /dev/kvm on the arm64 runner: the arm64 emulator cannot run here."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.kvm.outputs.available == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: steps.kvm.outputs.available == 'true'
        uses: ./.github/actions/setup-flutter

      - if: steps.kvm.outputs.available == 'true'
        name: Download the release APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" -n android-apk -D dist

      - if: steps.kvm.outputs.available == 'true'
        name: Launch and scenario on the emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/smoke/android_smoke.sh dist/app-release.apk

      - id: result
        env:
          KVM: ${{ steps.kvm.outputs.available }}
        run: |
          if [ "$KVM" = true ]; then echo "result=passed"; else echo "result=no-kvm"; fi >> "$GITHUB_OUTPUT"

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-android-arm64-v8a
          path: build/smoke
          if-no-files-found: ignore
