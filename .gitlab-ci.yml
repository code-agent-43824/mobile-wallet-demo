workflow:
  name: '$CI_PROJECT_NAME-$PIPELINE_KIND'
  rules:
    - if: '$CI_COMMIT_TAG'
      variables: { PIPELINE_KIND: "release" }
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables: { PIPELINE_KIND: "nightly" }
    - if: '$CI_COMMIT_BRANCH'
      variables: { PIPELINE_KIND: "ci" }

stages: [sast, test, build, pages, release]

# --- sast: статический анализ (semgrep) на выделенном sast-раннере (.81, ID 555).
# Фаза report-only: allow_failure=true, находки НЕ блокируют пайплайн.
semgrep-sast:
  stage: sast
  tags: [sast]
  allow_failure: true
  script:
    - export PATH=$HOME/.local/bin:$PATH
    - semgrep --version
    - semgrep scan --config p/default --metrics=off --quiet --json --output gl-sast-report.json || true
    - |
      python3 -c "
      import json
      try:
          r = json.load(open('gl-sast-report.json'))
      except Exception:
          print('SAST report not generated'); raise SystemExit
      n = len(r.get('results', []))
      print(f'SEMGREP SAST: {n} finding(s)')
      for f in r.get('results', []):
          print('  - [' + f['check_id'] + '] ' + f['path'])
      if n:
          print('REPORT-ONLY MODE: findings do not block this pipeline')
      "
  artifacts:
    paths: [gl-sast-report.json]
    when: always
    expire_in: 1 week

# --- test: формат / анализ / юнит-тесты (ветки и теги) ---
test:
  stage: test
  tags: [linux-x64]
  script:
    - flutter pub get
    - dart format --output=none --set-exit-if-changed .
    - flutter analyze
    - flutter test
# --- build: Android APK (Runner 544, тег android) ---
build-android:
  stage: build
  tags: [android]
  needs: [test]
  script:
    - flutter pub get
    - flutter build apk --release --dart-define-from-file=dart_defines.json
    - cp build/app/outputs/flutter-apk/app-release.apk mobile-wallet-demo-android.apk
  artifacts:
    paths: [mobile-wallet-demo-android.apk]
    expire_in: 1 week
  after_script:
    - rm -rf build/ .dart_tool/ 2>/dev/null || true
    - echo "CLEANUP_DONE"

# --- pages: копия документации (README + docs/) ---
pages:
  stage: pages
  tags: [linux-x64]
  needs: [test]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p public
    - cp README.md public/
    - cp -r docs public/docs
    - python3 scripts/build_pages.py
  artifacts:
    paths: [public]

# --- release: публикация APK + Release (только теги) ---
release:
  stage: release
  tags: [linux-x64]
  needs: [test, build-android]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - '[ -n "$RELEASE_TOKEN" ] || { echo "FATAL: RELEASE_TOKEN is empty (protected variable not visible for this ref / not set)"; exit 1; }'
    - VERSION="${CI_COMMIT_TAG#v}"
    - 'curl --fail --location --header "PRIVATE-TOKEN: $RELEASE_TOKEN" --upload-file mobile-wallet-demo-android.apk "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mobile-wallet-demo/${VERSION}/mobile-wallet-demo-${VERSION}-android.apk"'
    - 'curl --fail --request POST --header "PRIVATE-TOKEN: $RELEASE_TOKEN" --header "Content-Type: application/json" --data "{\"tag_name\":\"$CI_COMMIT_TAG\", \"name\":\"$CI_COMMIT_TAG\", \"assets\":{\"links\":[{\"name\":\"mobile-wallet-demo-${VERSION}-android.apk\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mobile-wallet-demo/${VERSION}/mobile-wallet-demo-${VERSION}-android.apk\"}]}}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"'
