org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin (AGP 9+, requires Flutter 3.47+). Explicitly enabled as the
# final step of the Flutter built-in Kotlin migration; when this flag is
# present the Flutter migrator does NOT overwrite it with =false.
android.builtInKotlin=true
# AGP 9.x embeds Kotlin 2.2.10 and reports it as the project's KGP version
# even with built-in Kotlin enabled; Flutter 3.47.2's dependency checker
# demands >= 2.2.20 (false positive for built-in Kotlin builds). Skip the
# check — Gradle 9.3.1 / Java 17 / AGP 9.1.0 are within Flutter's support
# range, verified manually.
skipDependencyChecks=true
