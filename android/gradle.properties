org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin mode (Flutter 3.47+, AGP 9+). Requires migrated pub plugins:
# file_selector_android >= 0.5.2+11 (older 0.5.2+6 applied kotlin-android over
# the built-in Kotlin extension and crashed with "Cannot add extension with
# name 'kotlin'").
android.builtInKotlin=true
# Flutter 3.47.2's DependencyVersionChecker reads the Kotlin version embedded
# in AGP 9.x (2.2.10) and fails it against its minimum (2.2.20) — a false
# positive: ALL AGP 9.x releases (9.1.0/9.3.3/9.4.1) embed 2.2.10, so built-in
# Kotlin can never pass this check. Our stack (Gradle 9.3.1, AGP 9.1.0) is
# deliberate; skip only the dependency version validation.
skipDependencyChecks=true
