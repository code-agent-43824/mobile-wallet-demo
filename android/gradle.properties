org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Both flags match what `flutter create` (3.47) writes for AGP 9 projects.
# newDsl=false: the Flutter Gradle plugin itself still reads the legacy
# android extension and fails on AGP 9's new DSL.
android.newDsl=false
# builtInKotlin=false: the app module is already in built-in-Kotlin form (no
# kotlin-android; Flutter applies KGP to it in this mode), and every plugin but
# one is migrated. The last blocker is walletconnect_pay 1.1.0 (latest, pulled
# by reown_walletkit), which applies kotlin-android unconditionally and fails
# under built-in Kotlin. Flip to true once a migrated walletconnect_pay ships.
android.builtInKotlin=false
